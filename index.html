    <!--
      Apply the saved (or system) theme before the first paint so the page
      never flashes the wrong palette while React boots.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ssa-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#fbfaf7' : '#08080b');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
